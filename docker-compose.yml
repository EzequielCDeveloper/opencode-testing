services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chapitos_db
      POSTGRES_USER: chapitos
      POSTGRES_PASSWORD: chapitos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapitos -d chapitos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Go API) ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://chapitos:chapitos@db:5432/chapitos_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-chapitos-dev-secret-change-me}
      JWT_HOURS: 14
    ports:
      - "8080:8080"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
